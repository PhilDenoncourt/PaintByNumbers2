services:
  - type: web
    name: paint-by-numbers
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /googlefc903bca6f6705cc.html
        destination: /googlefc903bca6f6705cc.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
