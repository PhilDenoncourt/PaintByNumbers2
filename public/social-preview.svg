  <text x="590" y="258" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Turn any photo into a</text>
  <text x="590" y="316" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">paint-by-numbers template</text>

  <text x="590" y="380" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="28">AI-powered image conversion, palette tuning,</text>
